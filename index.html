<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiểu cảnh Đờn ca tài tử Nam Bộ - 3D</title>
  <script type="module" src="https://googleapis.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #2b303a 0%, #111317 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
    }
    .loading-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      text-align: center;
      pointer-events: none;
    }
    .audio-btn {
      position: fixed;
      bottom: 25px;
      left: 20px;
      z-index: 9999;
      background: rgba(20, 20, 20, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <model-viewer 
    id="viewer"
    src="model.glb" 
    draco-decoder-path="https://gstatic.com"
    alt="Tiểu cảnh Đờn ca tài tử Nam Bộ"
    camera-controls 
    auto-rotate 
    auto-rotate-delay="3000"
    shadow-intensity="1" 
    exposure="1.0"
    touch-action="pan-y">
    <div class="loading-box" slot="poster" id="loading-text">
      ⏳ Đang tải mô hình 3D (0%)...
    </div>
  </model-viewer>

  <audio id="voice-desc" autoplay preload="auto">
    <source src="mota.mp3" type="audio/mpeg">
  </audio>

  <button class="audio-btn" id="toggle-btn" onclick="toggleAudio()">
    ▶️ Nghe thuyết minh
  </button>

  <script>
    const viewer = document.getElementById('viewer');
    const loadingText = document.getElementById('loading-text');
    const audio = document.getElementById('voice-desc');
    const btn = document.getElementById('toggle-btn');

    // Hiển thị phần trăm tải mô hình
    viewer.addEventListener('progress', (event) => {
      const percent = Math.round(event.detail.totalProgress * 100);
      loadingText.innerText = `⏳ Đang tải mô hình 3D (${percent}%)...`;
      if (percent === 100) {
        loadingText.innerText = '⚙️ Đang dựng hình ảnh 3D...';
      }
    });

    function updateUI(isPlaying) {
      btn.innerHTML = isPlaying ? '⏸️ Tạm dừng thuyết minh' : '▶️ Nghe thuyết minh';
    }

    function startAutoPlay() {
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          updateUI(true);
        }).catch(() => {
          updateUI(false);
          const unlock = () => {
            audio.play().then(() => {
              updateUI(true);
              ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(evt => 
                document.removeEventListener(evt, unlock)
              );
            });
          };
          ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(evt => 
            document.addEventListener(evt, unlock, { once: true })
          );
        });
      }
    }

    window.addEventListener('load', startAutoPlay);

    audio.addEventListener('ended', () => {
      btn.innerHTML = '🔄 Nghe lại thuyết minh';
    });

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        updateUI(true);
      } else {
        audio.pause();
        updateUI(false);
      }
    }
  </script>

</body>
</html>
