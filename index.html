<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiểu cảnh Đờn ca tài tử Nam Bộ - 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 1;
    }
    .audio-btn {
      position: fixed;
      bottom: 55px;
      left: 20px;
      z-index: 9999;
      background: rgba(20, 20, 20, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }
    .audio-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      color: #000;
    }
    .audio-btn.pulse {
      animation: pulse-border 1.5s infinite;
      border-color: #f5b041;
    }
    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(245, 176, 65, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(245, 176, 65, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 176, 65, 0); }
    }
  </style>
</head>
<body>

  <!-- Khung 3D tràn 100% màn hình -->
  <iframe 
    title="Tiểu cảnh Đờn ca tài tử Nam Bộ"
    src="https://sketchfab.com"
    allow="autoplay; fullscreen; xr-spatial-tracking" 
    allowfullscreen>
  </iframe>

  <!-- File âm thanh mô tả (bỏ loop để phát hết bài thuyết minh thì dừng, hoặc thêm chữ loop nếu muốn lặp lại) -->
  <audio id="voice-desc" autoplay preload="auto">
    <source src="mota.mp3" type="audio/mpeg">
  </audio>

  <button class="audio-btn" id="toggle-btn" onclick="toggleAudio()">
    🔊 Nghe thuyết minh mô hình
  </button>

  <script>
    const audio = document.getElementById('voice-desc');
    const btn = document.getElementById('toggle-btn');

    function updateUI(playing) {
      if (playing) {
        btn.innerHTML = '⏸️ Tạm dừng thuyết minh';
        btn.classList.remove('pulse');
      } else {
        btn.innerHTML = '🔊 Nghe thuyết minh mô hình';
        btn.classList.add('pulse');
      }
    }

    // Cố gắng tự động phát ngay khi tải trang
    window.addEventListener('DOMContentLoaded', () => {
      audio.play().then(() => {
        updateUI(true);
      }).catch(() => {
        // Nếu trình duyệt chặn tự động phát, nút sẽ nhấp nháy nhẹ và tự phát ngay khi người dùng chạm vào màn hình
        updateUI(false);
        const unlockAudio = () => {
          audio.play().then(() => {
            updateUI(true);
            document.removeEventListener('pointerdown', unlockAudio);
            document.removeEventListener('keydown', unlockAudio);
          });
        };
        document.addEventListener('pointerdown', unlockAudio);
        document.addEventListener('keydown', unlockAudio);
      });
    });

    // Tự động đổi lại chữ khi đọc hết bài thuyết minh
    audio.addEventListener('ended', () => {
      updateUI(false);
      btn.innerHTML = '🔄 Nghe lại thuyết minh';
    });

    // Nút bấm chủ động Bật/Tắt cho khán giả
    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        updateUI(true);
      } else {
        audio.pause();
        updateUI(false);
      }
    }
  </script>

</body>
</html>
