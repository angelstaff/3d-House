<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiểu cảnh Đờn ca tài tử Nam Bộ - 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 1;
    }
    .audio-btn {
      position: fixed;
      bottom: 55px;
      left: 20px;
      z-index: 9999;
      background: rgba(20, 20, 20, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }
    .audio-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Khung 3D Sketchfab đã tối ưu chống chặn tường lửa -->
  <iframe 
    title="nha" 
    referrerpolicy="no-referrer"
    src="https://sketchfab.com"
    frameborder="0" 
    allow="autoplay; fullscreen; xr-spatial-tracking" 
    allowfullscreen 
    mozallowfullscreen="true" 
    webkitallowfullscreen="true" 
    xr-spatial-tracking 
    execution-while-out-of-viewport 
    execution-while-not-rendered 
    web-share>
  </iframe>

  <!-- File âm thanh mô tả mô hình -->
  <audio id="voice-desc" autoplay preload="auto">
    <source src="mota.mp3" type="audio/mpeg">
  </audio>

  <button class="audio-btn" id="toggle-btn" onclick="toggleAudio()">
    ▶️ Nghe thuyết minh
  </button>

  <script>
    const audio = document.getElementById('voice-desc');
    const btn = document.getElementById('toggle-btn');

    function updateUI(isPlaying) {
      btn.innerHTML = isPlaying ? '⏸️ Tạm dừng thuyết minh' : '▶️ Nghe thuyết minh';
    }

    function startAutoPlay() {
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          updateUI(true);
        }).catch(() => {
          updateUI(false);
          const unlock = () => {
            audio.play().then(() => {
              updateUI(true);
              ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(evt => 
                document.removeEventListener(evt, unlock)
              );
            });
          };
          ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(evt => 
            document.addEventListener(evt, unlock, { once: true })
          );
        });
      }
    }

    window.addEventListener('load', startAutoPlay);

    audio.addEventListener('ended', () => {
      btn.innerHTML = '🔄 Nghe lại thuyết minh';
    });

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        updateUI(true);
      } else {
        audio.pause();
        updateUI(false);
      }
    }
  </script>

</body>
</html>
